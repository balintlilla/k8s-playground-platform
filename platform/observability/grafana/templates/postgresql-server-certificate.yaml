apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/part-of: k8s-playground
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: grafana-postgresql-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - grafana-postgresql
    - grafana-postgresql.observability
    - grafana-postgresql.observability.svc
    - grafana-postgresql.observability.svc.cluster.local
  usages:
    - server auth
    - client auth
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
