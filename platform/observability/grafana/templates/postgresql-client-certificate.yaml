apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-postgresql-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: k8s-playground
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: grafana-postgresql-client-tls
  duration: 2160h
  renewBefore: 720h
  commonName: grafana
  usages:
    - client auth
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
