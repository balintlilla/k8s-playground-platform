grafana:
  replicas: 1

  deploymentStrategy:
    type: Recreate

  podLabels:
    grafana-postgresql-client: "true"

  rbac:
    create: false

  serviceAccount:
    create: true
    name: grafana
    automountServiceAccountToken: false

  automountServiceAccountToken: false

  testFramework:
    enabled: false

  initChownData:
    enabled: false

  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-postgresql-credentials
        key: password

  extraSecretMounts:
    - name: grafana-postgresql-client-tls
      mountPath: /etc/grafana/postgresql
      secretName: grafana-postgresql-client-tls
      readOnly: true
      defaultMode: 0440

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
    appProtocol: http

  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  datasources:
    datasources.yaml:
      apiVersion: 1
      deleteDatasources:
        - name: Mimir
          orgId: 1
        - name: Tempo
          orgId: 1
        - name: Loki
          orgId: 1
      datasources:
        - name: Mimir
          uid: mimir
          type: prometheus
          access: proxy
          url: http://mimir-internal.observability.svc.cluster.local:8080/prometheus
          isDefault: true
          editable: false
          jsonData:
            httpMethod: POST
            prometheusType: Mimir
            timeInterval: 30s
            manageAlerts: false
            httpHeaderName1: X-Scope-OrgID
            exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: trace_id
          secureJsonData:
            httpHeaderValue1: k8s-playground
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo-internal.observability.svc.cluster.local:3200
          editable: false
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            nodeGraph:
              enabled: true
            search:
              hide: false
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -1m
              spanEndTimeShift: 1m
              tags:
                - key: k8s.namespace.name
                  value: namespace
                - key: k8s.pod.name
                  value: pod
              filterByTraceID: true
              filterBySpanID: true
              customQuery: false
            traceQuery:
              timeShiftEnabled: true
              spanStartTimeShift: -1h
              spanEndTimeShift: 1h
          secureJsonData:
            httpHeaderValue1: k8s-playground
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-internal.observability.svc.cluster.local:3100
          editable: false
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            maxLines: 1000
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"([a-f0-9]{32})"'
                datasourceUid: tempo
                url: '$${__value.raw}'
          secureJsonData:
            httpHeaderValue1: k8s-playground

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: Platform
          folderUid: platform
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform

  dashboardsConfigMaps:
    platform: grafana-platform-dashboards

  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    database:
      type: postgres
      host: grafana-postgresql.observability.svc.cluster.local:5432
      name: grafana
      user: grafana
      password: '$__env{GF_DATABASE_PASSWORD}'
      ssl_mode: verify-full
      ca_cert_path: /etc/grafana/postgresql/ca.crt
      client_cert_path: /etc/grafana/postgresql/tls.crt
      client_key_path: /etc/grafana/postgresql/tls.key
    auth.anonymous:
      enabled: false
    auth.basic:
      enabled: true
    users:
      allow_sign_up: false
      allow_org_create: false
      auto_assign_org: true
      auto_assign_org_role: Viewer
    security:
      disable_gravatar: true
      cookie_secure: true
      cookie_samesite: strict
    server:
      domain: grafana.k8s-playground.test
      root_url: https://grafana.k8s-playground.test/
    plugins:
      preinstall_disabled: true
    log:
      mode: console

  assertNoLeakedSecrets: true

  serviceMonitor:
    enabled: false

  ingress:
    enabled: false

  networkPolicy:
    enabled: false

postgresql:
  fullnameOverride: grafana-postgresql
  architecture: standalone

  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-1"

  image:
    digest: sha256:40a261ed77f3b8dc65eeeec98bb79c4d3ef3410d7e2af7cfcf3785a6af00e4c5

  auth:
    enablePostgresUser: false
    username: grafana
    database: grafana
    existingSecret: grafana-postgresql-credentials
    secretKeys:
      userPasswordKey: password

  tls:
    enabled: true
    autoGenerated: false
    certificatesSecret: grafana-postgresql-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    certCAFilename: ca.crt

  primary:
    persistence:
      enabled: true
      storageClass: standard
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    networkPolicy:
      enabled: true
      allowExternal: false
      allowExternalEgress: false

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  volumePermissions:
    enabled: false
    image:
      digest: sha256:52f04d8e29dc3d77929fca8d75890c4cabe6182f650e0e921057a744559a9736

  metrics:
    enabled: false

  backup:
    enabled: false
